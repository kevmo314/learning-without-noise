[project]
name = "learning-without-noise"
version = "0.1.0"
description = "Micro-scale experiments: fine-tuning forgetting is mostly optimizer noise"
requires-python = ">=3.12"
dependencies = [
    "torch==2.10.0",
    "transformers>=4.57",
    "peft>=0.17",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "huggingface-hub>=2.4.0",
    "tokenizers>=0.23.3",
    "datasets>=5.1.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
